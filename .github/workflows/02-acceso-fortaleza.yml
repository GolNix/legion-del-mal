
name: 🏯 Acceso a la fortaleza prohibida

on: push

jobs:
  acceso-a-la-base:
    runs-on: ubuntu-latest

    steps:
      - name: la superhéroe llega a la fortaleza
       
        run: |
         echo "Superheroe ${{ github.actor }} llega a la fortaleza."
         echo ""
         echo "Nombre clave: ${{ github.actor }}"
         echo ""
         echo "Buscar los archivos de la Legión del mal"
         ls -la
         echo ""
         echo "🪹 pero no hay nada de archivos"

      - name: Wonder Woman desbloquea la bóveda de la fortaleza
        uses: actions/checkout@v3

      - name: "ahora sí, vamos a ver los planes"
        run: |
         echo " Buscar los archivos de la Legión del mal"
         echo ""
         ls -la
         echo " 🆗 Funciona "
         echo ""
         echo "Planes:"
         ls planes/
         echo "Miembros"
         ls miembros/
         echo "Inteligencia"
         ls inteligencia/
