name: 🏰 Acceso a la Fortaleza prohibida 

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    
    steps:
      - name: El agente llega a la fortaleza
        run: |
          echo "Agente $ {GITHUB_ACTOR} ha llegado a la fortaleza prohibida."
          echo ""
          echo "Buscar Archivos de la Legión"
          ls -la
          echo ""
          echo "☠️pero qué paso? no hay nada"

      - name: Wonder Woman desbloquea la bóveda secreta
        uses: actions/checkout@v4

      -name: "ahora sí, vamos a ver los planes"
       run: |
          echo "Buscar los archivos de la Legión"
          ls -la
          echo ""
          echo "✅ Funciona!!!"
          echo ""
          echo "Planes;"
          ls planes/
          echo "Villanos;"
          ls villanos/
          echo "Inteligencia;"
          ls inteligencia/
          

          
