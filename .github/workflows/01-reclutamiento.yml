

name: Reclutamiento superheroe

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest
    steps:
      - name: El superhéroe se presenta
        run: echo "¡Hola! Soy la superhéroe de reclutamiento Wonder Woman."
    
      - name: Reporte de identidad
        run: |
         echo "¡identidad superhéroe."
         echo "================"
         echo ""
         echo "Nombre clave: ${{ github.actor }}"
         echo ""
         echo "Contexto de GitHub"
         echo "Repo: ${{ github.repository }}"
         echo "Operación: ${{ github.sha }}"
         echo "Operación: ${{ github.sha }}"
         echo "Metadata : ${{ toJSON(github) }}"
         

            