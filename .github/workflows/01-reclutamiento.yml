

name: Reclutamiento superheroe

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest
    steps:
      - name: El superhéroe se presenta
        run: echo "¡Hola! Soy la superhéroe de reclutamiento Wonder Woman."
    
      - name: Reporte de identidad
        run: |
         echo "¡identidad superhéroe."
         echo "================"
         echo ""
         echo "Nombre clave: ${{ github.actor }}"
         echo ""
         echo "Contexto de GitHub"
         echo "Repo: ${{ github.repository }}"
         echo "Operación: ${{ github.sha }}"
         echo "Operación: ${{ github.sha }}"
         echo "Metadata : ${{ toJSON(github) }}"

      - name: Capacidades de la superhéroe
        run: |
          echo "¡Capacidades de Wonder Woman!"
          echo "Sistema operativo"
          uname -a
          echo "Habilidades técnicas"
          node --version
          git --version
          python3 --version

      - name: Reconocimiento del terreno
        run: |
         echo "¡Reconocimiento del terreno!"
         ls /



    
    
