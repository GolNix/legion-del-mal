

name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs:
      superheroe:
        description: "¿Qué superhéroe envía el mensaje?"
        required: true
        type: choice
        options:
          - Wonder Woman
          - Brave
          - Maléfica
          - Mulán
      Mensaje:
        description: "Mensaje a transmitir para el consejo de la Legión del Mal"
        required: true
        default: "La misión fue un éxito"

     Prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
            - 🟢 Normal
            - 🔴 Crítica
            - 🟡 Media

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4s
