

name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs:
      superheroe:
        description: "¿Qué superhéroe envía el mensaje?"
        required: true
        type: choice
        options:
          - Wonder Woman
          - Brave
          - Maléfica
          - Mulán

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
